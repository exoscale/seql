---
name: Clojure
on: [push]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: DeLaGuardo/setup-clj-kondo@822352b8aa37d5c94135e67f7b4e2f46c08008a8 # v1
        with: {version: '2020.04.05'}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: clj-kondo --lint .
      - name: Install dependencies, Run syntax conformance checks
        run: lein do with-profile uberjar deps, cljfmt check
      - name: Run tests
        run: lein coverage --junit --lcov
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: 'target/coverage/junit.xml'
