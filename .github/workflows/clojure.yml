---
name: Clojure
on: [push]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: '2.12.0'
          clj-kondo: '2020.04.05'
      - uses: actions/checkout@v7.0.1
      - name: Lint
        run: clj-kondo --lint .
      - name: Install dependencies, Run syntax conformance checks
        run: lein do with-profile uberjar deps, cljfmt check
      - name: Run tests
        run: lein coverage --junit --lcov
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.7.1
        if: always()
        with:
          report_paths: 'target/coverage/junit.xml'
